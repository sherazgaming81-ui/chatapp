<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChatsApp — Cache saaf ho raha hai…</title>
<style>
body{background:#0b141a;color:#e9edef;font-family:system-ui;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
.box{text-align:center;padding:24px}
.spinner{width:40px;height:40px;border:4px solid #1f2c34;border-top-color:#00a884;border-radius:50%;margin:0 auto 16px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
<div class="spinner"></div>
<p>Purana cache saaf ho raha hai…</p>
</div>
<script>
(async function(){
  try {
    if ('serviceWorker' in navigator) {
      var regs = await navigator.serviceWorker.getRegistrations();
      for (var i=0;i<regs.length;i++){ try{ await regs[i].unregister(); }catch(e){} }
    }
    if ('caches' in window) {
      var keys = await caches.keys();
      for (var j=0;j<keys.length;j++){ try{ await caches.delete(keys[j]); }catch(e){} }
    }
    try{ localStorage.removeItem('chatsapp_app_version'); sessionStorage.clear(); }catch(e){}
  } catch(e){}
  // Taza start
  setTimeout(function(){ window.location.replace('/?fresh='+Date.now()); }, 800);
})();
</script>
</body>
</html>
